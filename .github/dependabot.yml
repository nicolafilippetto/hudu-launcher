# Aggiornamenti automatici delle dipendenze: Dependabot apre una pull request quando esce una
# nuova versione. I test della pipeline dicono se l'aggiornamento è sicuro da unire.
# Cooldown: si aspettano alcuni giorni dalla pubblicazione, per non prendere subito un pacchetto
# compromesso o ritirato (attacchi alla catena di fornitura).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*"]

  - package-ecosystem: nuget
    directory: /connector
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Si resta sulla versione LTS di .NET: solo correzioni e versioni minori. Il passaggio a una
    # nuova versione principale è una migrazione (progetti, global.json, immagini) da fare a mano.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # init, analyze e upload-sarif di CodeQL vanno aggiornati insieme: con versioni diverse
    # l'analisi fallisce ("configuration error").
    groups:
      codeql:
        patterns: ["github/codeql-action*"]
