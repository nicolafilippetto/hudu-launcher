name: Hudu Launcher per Windows

on:
  # Ogni modifica compila e prova il Launcher (minuti gratuiti nei repository pubblici).
  push:
    branches: ["**"]
    # Un tag v1.2.3 pubblica l'installer nelle Release di GitHub.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-${{ github.ref }}
  cancel-in-progress: true

env:
  # Indirizzo predefinito del portale, inserito nell'app (facoltativo: senza, il Launcher lo impara
  # dal primo link). Settings → Secrets and variables → Actions → Variables (LAUNCHER_PORTAL_URL).
  # In un repository pubblico l'installer è pubblico: meglio lasciarlo vuoto.
  PORTAL_URL: ${{ vars.LAUNCHER_PORTAL_URL }}

jobs:
  build:
    name: Compilazione, test e installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: connector
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Servono i tag per numerare le build di prova dopo l'ultima versione pubblicata.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: connector/global.json

      - name: Test
        run: dotnet test tests/Launcher.Connector.Tests

      - name: Versione
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Tag v1.2.3 → 1.2.3. Le build di prova sono la versione successiva all'ultimo tag con
          # suffisso (es. 1.2.2-ci.31): si installano sopra la 1.2.1 senza avviso di downgrade e la
          # 1.2.2 definitiva le aggiorna.
          if ($env:REF_TYPE -eq "tag") {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag non valido: usare vX.Y.Z" }
            $version = $Matches[1]
          } else {
            $latest = git tag --list 'v*' |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_.Substring(1) } |
              Sort-Object -Descending | Select-Object -First 1
            if (-not $latest) { $latest = [version]'1.0.0' }
            $version = '{0}.{1}.{2}-ci.{3}' -f $latest.Major, $latest.Minor, ($latest.Build + 1), $env:RUN_NUMBER
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versione $version"

      - name: Pubblicazione (self-contained, ReadyToRun)
        run: >
          dotnet publish src/Launcher.Connector/Launcher.Connector.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:PortalUrl="${{ env.PORTAL_URL }}"

      - name: Installer per utente (Velopack)
        run: |
          dotnet tool install --global vpk --version 1.2.161
          vpk pack `
            --packId HuduLauncher `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir publish `
            --mainExe HuduLauncher.exe `
            --packTitle "Hudu Launcher" `
            --packAuthors "Hudu Launcher" `
            --icon src/Launcher.Connector/Assets/launcher.ico `
            --outputDir releases

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HuduLauncher-${{ steps.version.outputs.version }}
          path: |
            connector/releases/*-Setup.exe
            connector/releases/*.nupkg
            connector/releases/RELEASES*
            connector/releases/releases.*.json
          if-no-files-found: error
          retention-days: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    name: Release GitHub
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    # Solo questo job può scrivere nel repository, e solo per creare la Release e le attestazioni.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: HuduLauncher-${{ needs.build.outputs.version }}
          path: release

      # Prova verificabile che i file escono da questa pipeline e da questo commit:
      # gh attestation verify HuduLauncher-win-Setup.exe --repo <proprietario>/hudu-launcher
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Crea la Release con l'installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release
          sha256sum -- * > SHA256SUMS.txt
          # La Release può essere già stata creata dal sito di GitHub (anche dal cellulare): in quel
          # caso si allegano solo i file.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Hudu Launcher $VERSION" --generate-notes -- *
          fi
