name: Sicurezza

# Analisi statica (SAST) e controllo delle dipendenze: a ogni modifica e ogni lunedì, anche senza
# modifiche, perché nuove vulnerabilità vengono pubblicate di continuo. Gli analizzatori di
# sicurezza .NET sono già attivi in ogni compilazione (AnalysisModeSecurity=All); CodeQL è in
# codeql.yml. I risultati di Semgrep e CodeQL compaiono in Security → Code scanning.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (SAST e segreti)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installazione
        run: python3 -m pip install --user semgrep==1.182.1

      - name: Analisi
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan --metrics off --error --severity ERROR --severity WARNING \
            --config p/csharp --config p/security-audit --config p/secrets --config p/javascript \
            --config p/owasp-top-ten --config p/dockerfile --config p/github-actions \
            --exclude "xterm.js" --exclude "addon-fit.js" --exclude "Migrations" \
            --sarif --output semgrep.sarif .

      - name: Rapporto
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep
          path: semgrep.sarif
          retention-days: 30

      # Semgrep mette nel SARIF anche i risultati soppressi nel codice (nosemgrep, con la motivazione
      # accanto) e Code scanning li mostrerebbe come aperti: si caricano solo quelli non soppressi.
      - name: Solo risultati aperti
        if: always()
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' semgrep.sarif > semgrep-open.sarif

      # In Security → Code scanning (gratuito nei repository pubblici). Le pull request da fork
      # hanno un token in sola lettura: lì resta solo il rapporto qui sopra.
      - name: Code scanning
        if: always() && !github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep-open.sarif
          category: semgrep

  dependencies:
    name: Librerie vulnerabili
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: server/global.json

      - name: Server e Launcher
        run: |
          status=0
          for solution in server/Launcher.slnx connector/Launcher.Connector.slnx; do
            dotnet restore "$solution"
            dotnet list "$solution" package --vulnerable --include-transitive 2>&1 | tee -a vulnerable.txt
          done
          if grep -q "has the following vulnerable packages" vulnerable.txt; then status=1; fi
          exit $status

  dependency-review:
    name: Dipendenze nuove nella pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocca le pull request che introducono librerie o azioni con vulnerabilità note.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
